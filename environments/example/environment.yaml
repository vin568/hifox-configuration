# Copy this directory to environments/<your-environment>.
organization: rayfox
space: AF
# Configuration-set name under config/ (bound by name, no paths; ADR 0028).
# Change when cloning a different configuration set.
configSet: apifox
# Target deployment instance (closed set): hifox | sharkly.
# cli.path optionally points at a specific build of that instance (e.g. a test CLI).
cli:
  app: hifox
nameSuffix: " - example"
namingPattern: "{{name}}{{suffix}}"
visibility:
  crew: personal
  agents: personal
# Environment-level run target default; null = no default (agents declare
# their own, or bind one here: --computer <name> --runtime <provider>).
target: null
