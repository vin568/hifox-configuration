# 二龙山：吴用（wuyong）在 Apifox 产研 Space 的专家调度分舵（Branch Hall，ADR 0004）。
# 手动触发：hifox workflow run <id> --space "Apifox 产研" --async --input '{"topic":"apifox","message":"…","context":"…"}'
# 按主题分支派给燕青（yanqing）执行；run_agent 不带 task id → 不产生任务卡；
# 分支末块的最终输出即执行结果，由吴用跨 Space 查询执行状态后转述给用户。
blocks:
  - id: b-start
    name: Start
    type: start_trigger
    trigger: true
  - id: b-route
    name: Route
    condition:
      # start.input 的运行时形态（字符串/对象）未钉死，typeof 三元式双态兼容（ADR 0002）
      - id: apifox
        title: apifox
        when: "(typeof <start.input> === 'string' ? JSON.parse(<start.input>) : <start.input>).topic === 'apifox'"
      - id: else
        title: else
  - id: b-yanqing
    name: YanQing
    agent: yanqing
    work: |-
      吴用（统筹调度）跨 Space 转来的 apifox（Apifox / Apidog 产品：docs-site / server-apps / tars-app / tars-cli）主题请求，输入载荷（JSON，字段 topic / message / context）：<start.input>
      本条消息只走聊天模式：只做排查、分析、定位或答复——读仓库、查代码事实、给结论与建议；不进入任务模式——不改代码、不建分支、不提交、不部署 staging、不创建任务。需要完整开发时，在结论中明确「建议建任务」并给出验收要点，由吴用与用户确认后在 Apifox 产研 Space 建任务委派。
      最终消息 = 给用户的答复正文（纯文本，吴用会转述），不要输出 JSON。
  - id: b-reject
    name: Reject
    shell: reject.sh
    timeout: 60000

edges:
  - { from: b-start, to: b-route }
  - { from: b-route, to: b-yanqing, branch: apifox }
  - { from: b-route, to: b-reject, branch: else }
