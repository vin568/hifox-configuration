name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# macOS runner：serve 的进程归属判定读 BSD `ps -wwE`，且实际执行面是 macOS/herdr；
# 在 Linux 上测到的不是生产路径。
#
# 子模块 vendor/super-agent 是另一个私有仓（vin568/super-agent）。GITHUB_TOKEN 只对
# 本仓有效，必须给一个可读该仓的 SUBMODULE_TOKEN（classic PAT，repo scope）。
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: authorize private submodule
        run: |
          git config --local url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: init submodules
        run: git submodule update --init --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/super-agent/go.mod
          cache-dependency-path: vendor/super-agent/go.sum
      - name: install yq
        run: brew install yq
      - name: build stable entry
        run: ./scripts/build
      - run: npm test
      - run: npm run check
