name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# macOS runner：框架的 serve 归属判定读 `ps -wwE`（BSD 形状），Linux 的 ps
# 语义不同，那里测的不是生产路径。
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/super-agent/go.mod
          cache-dependency-path: vendor/super-agent/go.sum
      - name: install yq
        run: brew install yq
      - name: build stable entry
        run: ./super-agent/build
      - run: npm test
      - run: npm run check
