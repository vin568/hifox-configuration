# superctl 配置样例（本仓是宋江实例：框架在 vendor/super-agent，能力声明在仓根）。
#
# 密钥不进此文件：飞书凭证读环境变量 <env_prefix>_FEISHU_APP_ID / <env_prefix>_FEISHU_APP_SECRET。
# 框架化的实例根 = 本文件所在目录：capabilities/、direct/、bin/ 都相对它解析。

schema_version = 1

session    = "super-agent"                  # herdr 命名 session
state_dir  = "~/.local/state/super-agent"   # 运行时状态目录（按实例名，不按主控人格名）
# 实例根：本配置放在 ~/.config/super-agent/ 时，必须显式指向仓根（capabilities/、
# direct/、bin/ 都在那里），否则会相对配置目录解析（落在家目录下）。
instance_dir = "~/code/apifox/northstar"
env_prefix = "SUPERAGENT"                   # 凭证环境变量前缀（新实例由 superctl init 按主控 key 派生）
runtime_cmd = "/ABS/PATH/northstar/bin/superctl"  # 稳定入口（scripts/build 产物）
work_dir   = "~/code/apifox/northstar"  # agent pane 的 cwd（主检出）；也是 skills.yaml 里 `@/` 的锚（ADR 0050）；本仓 = 实例根

# 主控与复盘 agent 不在此声明：由能力注册表 role=master / role=retro 派生。
# 平台任务的人工豁免表不是配置键：state_dir/untracked.yaml，由 superctl untracked 维护（ADR 0054）。

tick_interval          = "10m"  # 作业巡检兜底周期（三源皆空不发）
platform_poll_interval = "60s"  # 平台哨兵轮询周期（纯 CLI 轮询零 LLM 成本，有变化才唤醒主控）
review_interval        = "3h"   # 主控整体审视周期（墙钟对齐到日界；干净时只写审视记录）
retro_at               = "02:00" # 日度复盘触发时刻（本地时区 HH:MM；off = 不排期）

# 上下文轮换：主判定 = provider 回报的 token / 模型 contextWindow；
# context_reserve_* 决定 handoff 触发点（window - max(15%, 16k)）。session_max_bytes
# 只在测量不可用（旧会话/未知模型）时作字节兜底；0 = 关闭字节兜底。
context_warn_ratio         = 0.70
context_reserve_ratio      = 0.15
context_reserve_min_tokens = 16000
context_warn_margin_tokens = 8000
context_model_db           = "~/.omp/agent/models.db"
local_stall_after          = "45m"  # working 但会话文件这么久没写入 → 巡检告警（0 = 关）
blocked_recover_after      = "30m"  # 主控卡在等人确认的界面这么久 → 自动换脑自救（24h 内至多两次；0 = 关）
session_max_bytes          = 8388608
sessions_keep              = 5

# 飞书消息附件（图片/文件）落盘保留期；空 = 30 天。
media_retention = "720h"

# 已发送回帖在发件箱里的保留期（撤回依据）；0 = 永久保留。
outbox_retention = "168h"

# 注入健康判据（status 的 degraded）：连续失败达到阈值、且窗口内没有一次成功。
# 默认 2 次 / 60s；启动时钉进 serve.json，status 用运行中进程的策略。
inject_fail_threshold = 2
inject_fail_window    = "60s"

# 飞书放行面：open_id 白名单，私聊只放行白名单成员（其他人不注入）。
allowed_users = ["ou_replace_me"]

# 代答群：群内 @ 白名单成员（而非 @bot）也放行，按代答处理。
proxy_reply_groups = []

# 实例主人在平台侧的身份（hifox 成员邮箱或 member:<id>）：平台任务默认负责人。
# 不写死人名；留空时只能靠 --assignee 点名负责人。
owner_member = ""

# bot 自己的 open_id（识别 @bot 用；建好自建应用后从开发者后台取，留空则群里收不到 @bot）。
bot_open_id = ""

# 私聊通知兜底会话：急停回执与 blocked 提醒的落点；填你与 bot 的 chat_id。
admin_chat_id = ""

# agent start 透传给主控底层 CLI（omp）的参数，如指定快模型；留空用默认。
master_agent_args = []

# 模型窗口覆盖：provider/model 或 model -> contextWindow。harness 自报优先；
# 这里只补 omp 本地目录查不到的自定义模型。
[context_windows]
# "hifox/deepseek-flash" = 1000000

# 通用上下文探针：kind -> 命令。命令输出统一 JSON（见框架 README）。
[context_probes]
# opencode = "/path/to/probe-opencode-context"
