# 为什么需要这张表：哨兵只盯在途清单（inflight.json）里的平台条目。平台侧已指派、
# 却不在清单里的单，停滞 / 拒执 / 疑似卡死三类事件永远不会报——2026-11-24 实测
# HF-16321/16322/16324/16325 四张单这样静默了十小时。`npm run check:live` 的
# 在途差集检查负责把这类漏登报出来。
