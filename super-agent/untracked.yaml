# 豁免不能写在在途清单的 note 里：清单就是哨兵的视野，「在清单里但标不跟踪」自相
# 矛盾——框架不读 note，照样轮询、照样注入事件。所以豁免住在清单之外。
#
# 口径：这里只放**确认过不需要哨兵盯**的任务号（人工收口、由别的实例管、
# 派了但决定不追）。漏登的单要么补登记进在途清单，要么写进这里——两者都不做，
# check:live 就一直报。
